<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yt_clipper Editor</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/video.js@8.22.0/dist/video-js.min.css"
      integrity="sha384-7EhvnnsmFfBQmzyff3uFsStsUKyx5Qvh0P5TjPdZheUpELX9ER5CkgYHp1sxF02A"
      crossorigin="anonymous"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #000;
      }

      #ytc-media-player-container {
        height: 80vh;
        width: 98vw;
        background-color: #000;
        margin-left: 1vw;
        margin-right: 1vw;
        padding-bottom: 35px;
        position: relative;
      }

      #ytc-video-title {
        color: white;
        padding: 2px;
        margin-left: 1vw;
        margin-right: 1vw;
      }

      /* Apply to raw <video> elements */
      video:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }

      /* Apply to Video.js' tech element */
      .vjs-tech:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }

      media-player,
      #my-video {
        width: 100%;
        height: 100%;
        display: block;
      }

      .vjs-volume-panel.vjs-hover {
        width: auto !important; /* Prevents it from collapsing */
        opacity: 1 !important; /* Forces it visible */
        visibility: visible !important;
      }
      .vjs-volume-panel {
        width: auto !important;
      }

      .video-js .vjs-remaining-time {
        display: none !important;
      }

      .video-js .vjs-duration {
        display: inline-block !important;
      }

      .video-js .vjs-current-time {
        display: inline-block !important;
      }

      .video-js .vjs-control-bar {
        background-color: rgba(43, 51, 63, 0);
      }

      .video-js .vjs-control-bar {
        display: flex;
        flex-wrap: wrap;
        flex-direction: row;
      }

      .video-js .vjs-progress-control {
        order: -1; /* Move to top */
        width: 100%;
        margin-bottom: 5px; /* spacing from the rest */
      }
      .video-js .vjs-progress-control .vjs-progress-holder {
        margin: 0;
      }

      .video-js .vjs-slider {
        margin: 0;
      }
      /* Override default hiding behavior */
      .video-js.vjs-user-inactive .vjs-control-bar {
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none; /* Optional: avoid interaction when hidden */
      }

      /* Ensure control bar is visible when user is active */
      .video-js .vjs-control-bar {
        opacity: 1;
        transition: opacity 0.4s ease;
      }

      /* Styled after Video.js 10's default skin seek indicator, so the look stays when the player moves to it. */
      .ytc-seek-indicator {
        position: absolute;
        top: 50%;
        z-index: 10001;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 99px;
        background-color: rgb(0 0 0 / 25%);
        box-shadow: 0 0 0 1px rgb(0 0 0 / 10%), 0 1px 3px 0 rgb(0 0 0 / 15%);
        backdrop-filter: blur(16px) saturate(110%);
        color: #fff;
        font: 500 16px/1 system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        opacity: 0;
        translate: 0 -50%;
        transition: opacity 0.15s cubic-bezier(0, 0, 0.2, 1);
      }
      .ytc-seek-indicator[data-open] {
        opacity: 1;
      }
      .ytc-seek-indicator[data-direction='backward'] {
        left: 8%;
        flex-direction: row-reverse;
      }
      .ytc-seek-indicator[data-direction='forward'] {
        right: 8%;
      }
      .ytc-seek-indicator svg {
        width: 27px;
        height: 27px;
        transition: translate 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .ytc-seek-indicator[data-direction='backward'] svg {
        scale: -1 1;
      }
      .ytc-seek-indicator[data-direction='backward']:not([data-open]) svg {
        translate: 8px 0;
      }
      .ytc-seek-indicator[data-direction='forward']:not([data-open]) svg {
        translate: -8px 0;
      }
    </style>
    <script>
      document.addEventListener('drop', handleDrop);
      document.addEventListener('dragover', (e) => e.preventDefault());
      document.addEventListener('paste', handlePaste);

      function handlePaste(e) {
        e.preventDefault();

        const clipboardData = e.clipboardData || window.clipboardData;
        const pastedText = clipboardData.getData('text');

        const videoLoaded = loadVideoFromPaste(pastedText);
        finalizeVideoLoad(videoLoaded);
      }

      function handleDrop(e) {
        e.preventDefault();
        const videoLoaded = loadVideoFromDrop(e);
        finalizeVideoLoad(videoLoaded);
      }

      function finalizeVideoLoad(videoLoaded) {
        if (videoLoaded) {
          installVideojs();
          document.removeEventListener('drop', handleDrop);
          document.removeEventListener('paste', handlePaste);
        }
      }

      function loadVideoFromPaste(pastedText) {
        if (!pastedText.includes('\n')) {
          const url = pastedText.trim();
          const extension = getFileExtensionFromUrl(url);

          if (extension === 'm3u8') {
            loadHlsVideo(url);
          } else {
            document.querySelector('video').src = url;
            document.querySelector('#ytc-video-title').textContent = url;
          }
          videoLoaded = true;
        } else {
          const links = pastedText.split('\n', 2);
          const videoLink = links[0].trim();
          const audioLink = links[1].trim();
          if (getFileExtensionFromUrl(videoLink) === 'm3u8') {
            loadHlsVideoAndAudio(videoLink, audioLink);
          }
          videoLoaded = true;
        }

        return videoLoaded;
      }

      function loadHlsVideoAndAudio(videoLink, audioLink) {
        const masterPlaylist = `#EXTM3U
#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="aac",NAME="Default",DEFAULT=YES,AUTOSELECT=YES,URI="${audioLink}"
#EXT-X-STREAM-INF:BANDWIDTH=2000000,CODECS="avc1.640034",AUDIO="aac"
${videoLink}
`;

        const blob = new Blob([masterPlaylist], { type: 'application/vnd.apple.mpegurl' });
        const masterUrl = URL.createObjectURL(blob);

        loadHlsVideo(masterUrl);
      }

      function loadVideoFromDrop(e) {
        let videoLoaded = false;

        const file = e.dataTransfer.files?.[0];
        const data = e.dataTransfer.getData('text/plain');

        if (file && file.type.startsWith('video/')) {
          const url = URL.createObjectURL(file);
          document.querySelector('video').src = url;
          document.querySelector('#ytc-video-title').textContent = file.name;
          videoLoaded = true;
        }

        return videoLoaded;
      }

      function loadHlsVideo(hlsUrl) {
        const video = document.getElementById('my-video');

        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(hlsUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = hlsUrl;
          video.addEventListener('loadedmetadata', () => video.play());
        }
      }

      function getFileExtensionFromUrl(urlString) {
        if (typeof urlString !== 'string') return null;

        const pathPart = urlString.split('?')[0].split('#')[0];
        const segments = pathPart.split('/');
        const filename = segments.pop();

        if (!filename || !filename.includes('.')) return null;

        const parts = filename.split('.');
        return parts.length > 1 ? parts.pop().toLowerCase() : null;
      }

      // Shows how far the seek keys moved, like Video.js 10's seek indicator: steps in one direction add up
      // until it closes.
      function createSeekIndicator(container) {
        const SEEK_INDICATOR_CLOSE_DELAY = 800;
        const indicator = document.getElementById('ytc-seek-indicator');
        const value = indicator.querySelector('.ytc-seek-indicator-value');
        container.appendChild(indicator);
        let total = 0;
        let closeTimer;

        return (seconds) => {
          const direction = seconds < 0 ? 'backward' : 'forward';
          const isSameSeek = indicator.hasAttribute('data-open') && indicator.dataset.direction === direction;
          total = (isSameSeek ? total : 0) + Math.abs(seconds);
          indicator.dataset.direction = direction;
          value.textContent = `${total}s`;
          indicator.toggleAttribute('data-open', true);
          clearTimeout(closeTimer);
          closeTimer = setTimeout(() => indicator.removeAttribute('data-open'), SEEK_INDICATOR_CLOSE_DELAY);
        };
      }

      function installVideojs() {
        const player = videojs('my-video', {
          playbackRates: [0.25, 0.5, 1, 1.25, 1.5, 1.75, 2],
          enableSmoothSeeking: true,
          userInactiveTimeout: 0,
          controlBar: {},
        });
        const showSeek = createSeekIndicator(player.el());
        const seekBy = (seconds) => {
          const time = player.currentTime() + seconds;
          player.currentTime(Math.min(player.duration(), Math.max(0, time)));
          showSeek(seconds);
        };

        // Prevent default behavior like scrolling when spacebar is pressed
        document.addEventListener('keydown', function (event) {
          const activeTag = document.activeElement.tagName;
          const isTyping = ['INPUT', 'TEXTAREA', 'BUTTON', 'SELECT'].includes(activeTag);
          const SEEK_STEP = 1;
          const ARROW_SEEK_STEP = 5;
          const SHIFT_ARROW_SEEK_STEP = 10;
          const DEFAULT_FPS = 30;
          const FRAME_STEP = 1 / DEFAULT_FPS;

          if (isTyping) return;

          if (event.code === 'Space' || event.code === 'KeyK') {
            event.preventDefault();
            if (player.paused()) {
              player.play();
            } else {
              player.pause();
            }
          }

          switch (event.code) {
            case 'KeyM':
              event.preventDefault();
              player.muted(!player.muted());
              break;
            case 'KeyJ':
              event.preventDefault();
              seekBy(-SEEK_STEP);
              break;
            case 'KeyL':
              event.preventDefault();
              seekBy(SEEK_STEP);
              break;
            case 'ArrowLeft':
            case 'ArrowRight': {
              // Ctrl and Alt arrows belong to the markup script's marker navigation.
              if (event.ctrlKey || event.altKey || event.metaKey) break;
              event.preventDefault();
              const step = event.shiftKey ? SHIFT_ARROW_SEEK_STEP : ARROW_SEEK_STEP;
              seekBy(event.code === 'ArrowLeft' ? -step : step);
              break;
            }
            case 'Comma':
              event.preventDefault();
              if (!player.paused()) player.pause();
              player.currentTime(Math.max(0, player.currentTime() - FRAME_STEP));
              break;
            case 'Period':
              event.preventDefault();
              if (!player.paused()) player.pause();
              player.currentTime(Math.min(player.duration(), player.currentTime() + FRAME_STEP));
              break;
          }
        });
      }
    </script>

    <script></script>
  </head>
  <body>
    <div id="ytc-media-player-container">
      <video
        id="my-video"
        class="video-js vjs-default-skin"
        controls
        preload="auto"
        width="100%"
        height="100%"
      >
        <p class="vjs-no-js">
          To view this video please enable JavaScript, and consider upgrading to a web browser that
          <a href="https://videojs.com/html5-video-support/" target="_blank"
            >supports HTML5 video</a
          >
        </p>
      </video>
      <div id="ytc-seek-indicator" class="ytc-seek-indicator" aria-hidden="true">
        <!-- Video.js 10's seek icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 18 18">
          <path
            d="M9 1a7.98 7.98 0 0 1 6.132 2.867l1.441-1.44a.25.25 0 0 1 .427.177V6.75a.25.25 0 0 1-.25.25h-4.146a.25.25 0 0 1-.177-.427L13.71 5.29A5.99 5.99 0 0 0 9 3a6 6 0 0 0-4.242 10.242l-1.415 1.415A8 8 0 0 1 9 1"
          />
        </svg>
        <span class="ytc-seek-indicator-value"></span>
      </div>
    </div>

    <div id="ytc-editor"></div>

    <h2 id="ytc-video-title">
      To load a local video, drag and drop it onto the player OR paste a direct video URL anywhere
      (e.g. with ctrl+v). Then activate the markup user script.
    </h2>

    <script
      src="https://cdn.jsdelivr.net/npm/video.js@8.22.0/dist/video.min.js"
      integrity="sha384-0Zjlg/LXXXTSOSSKXriW6rMnrV3rQEuv1CNy1vdKpe4aXQAMNm7lFLo+5MNRlvdb"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/hls.js@1.6.2/dist/hls.min.js"
      integrity="sha384-QHoMEQEjeievZsHu5ejPFm+o1o93XoWIEziW/+oc9LLMGsPNAbp1pN4PHhI/KIzW"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
