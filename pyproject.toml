[project]
name = "clipper"
version = "5.48.0"
description = "Quickly generate clipped webms."
authors = [{ name = "exwm", email = "rjvgb@protonmail.com" }]
requires-python = ">=3.12,<3.13"
readme = "readme.md"
license = "MIT"
dependencies = [
    "yt-dlp[default]==2026.10.21",
    "coloredlogs>=15.0.1,<16",
    "notify-py>=0.3.3,<0.4",
    "verboselogs~=1.7",
    "webvtt-py>=0.4.6,<0.5",
    "certifi>=2026.2.25",
    "rich>=13.9.1,<14",
    "rich-argparse>=1.5.2,<2",
    "ffmpeg-quality-metrics>=3.11.3,<4",
    "plotille>=6.0.5",
    "jsonschema>=4.26.0,<5",
    "numpy>=2.5.4,<3",
]

[project.scripts]
yt_clipper = "clipper.yt_clipper:main"

[dependency-groups]
dev = [
    "pyinstaller==6.9.0",
    "ruff==0.14.14",
    "pillow>=12.3.0,<13",
]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5.0.0,<6",
    "diff-cover>=10.6.0,<11",
    "syrupy>=6.1.1,<7",
    "pytest-xdist>=3.8.0,<4",
]
ui-test = [
    "playwright==1.63.0",
    "pytest-playwright>=0.10.0,<0.11",
    "pytest-rerunfailures>=16.7,<17",
]

[tool.uv]
default-groups = [
    "dev",
    "test",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.black]
line-length = 100
include = '\.pyi?$'

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "-ra"
# A hung test (a subprocess that never returns) prints every thread's stack after this many seconds.
faulthandler_timeout = 600
testpaths = "src/clipper/tests"
pythonpath = "src"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
# Beside the reports, not in the repo root (with one part file per process until combined).
data_file = "coverage/.coverage"
branch = true
source = ["src/clipper"]
omit = ["src/clipper/tests/*"]

[tool.coverage.report]
# The current total, rounded down: raise it as coverage grows so it cannot silently drop.
fail_under = 52
skip_empty = true

[tool.coverage.html]
directory = "coverage/clipper"

[tool.coverage.xml]
output = "coverage/clipper.xml"

[tool.pyright]
# The UI tests import their harness package from beside them, as pytest does.
executionEnvironments = [{ root = "integration-tests/ui" }]
