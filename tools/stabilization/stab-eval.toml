# `just stab-eval`: which cases --quick runs, and what each case and preset is expected to show.
# Clips are the `stab-*` cases in tools/media/cases/stab.toml. Presets: 1 Very Weak, 3 Medium, 6 Strongest.

# A spread of the traits that broke stabilization before: a black lead-in, an exposure dip, a fast
# whip, a dark concert, a subject moving on its own, L1 stalls, an FPV flight, a low contrast stretch
# and a hard cut
