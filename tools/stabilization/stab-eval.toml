# `just stab-eval`: which cases --quick runs, and what each case and preset is expected to show.
# Clips are the `stab-*` cases in tools/media/cases/stab.toml. Presets: 1 Very Weak, 3 Medium, 6 Strongest.

# A spread of the traits that broke stabilization before: a black lead-in, an exposure dip, a fast
# whip, a dark concert, a subject moving on its own, L1 stalls, an FPV flight, a low contrast stretch
# and a hard cut
quick = [
  "stab-MusicVideo_1080P-6c1d",
  "stab-Vlog_1080P-3744",
  "stab-Sports_1080P-0640",
  "stab-VerticalVideo_480P-7278",
  "stab-Vlog_1080P-4f26",
  "stab-MusicVideo_1080P-106d",
  "stab-VerticalVideo_1080P-3709",
  "stab-fpv-alpine",
  "stab-shaky-flashconcert",
  "stab-shaky-dim",
  "stab-shaky-cut",
]
quick_presets = [1, 6]

# kind: worse (more than 10% shakier than 5.49.0, which ran vid.stab's gaussian camera path), warn
# (the shakier clip warning), stall (vid.stab's L1 camera path failed to solve). An entry that stops
# holding fails the run, so update it then.
# Worse also needs the shakier clip warning's absolute margin, so noise where 5.49 left almost no
# shake does not count.
expected = [
  { case = "stab-LiveMusic_360P-265c", preset = 6, kind = "warn", reason = "14.7 against 11.6 unstabilized (1e-4 of the width), at the 15% crop cap where 5.49.0 cropped 23%" },
  { case = "stab-Vlog_1080P-4f26", preset = 1, kind = "warn", reason = "40.1 against 9.5 unstabilized (1e-4 of the width), still steadier than 5.49.0" },
  { case = "stab-Vlog_1080P-4f26", preset = 3, kind = "warn", reason = "33.2 against 9.5 unstabilized (1e-4 of the width), still steadier than 5.49.0" },
  { case = "stab-Vlog_1080P-4f26", preset = 6, kind = "warn", reason = "25.8 against 9.5 unstabilized (1e-4 of the width), still steadier than 5.49.0" },
  { case = "stab-VerticalVideo_1080P-4925", preset = 6, kind = "worse", reason = "1.99x 5.49.0's shake, which cropped 114% to steady it (5.50 caps at 15%)" },
  { case = "stab-Sports_1080P-0640", preset = 6, kind = "worse", reason = "1.13x 5.49.0's shake, which cropped 78% to steady it (5.50 caps at 15%)" },
  { case = "stab-LiveMusic_360P-6a65", preset = 6, kind = "worse", reason = "3.51x 5.49.0's shake, which cropped 50% to steady it (5.50 caps at 15%)" },
  { case = "stab-LiveMusic_720P-3320", preset = 6, kind = "worse", reason = "1.15x 5.49.0's shake, which cropped 31% (5.50 caps at 15%); a blurred whip neither steadies" },
  { case = "stab-LiveMusic_720P-3320", preset = 1, kind = "warn", reason = "62.9 against 59.4 unstabilized (1e-4 of the width): a blurred whip neither 5.49.0 nor 5.50 steadies" },
  { case = "stab-fpv-sanfrancisco", preset = 1, kind = "worse", reason = "1.37x 5.49.0's shake: a nearly steady flight, where the L1 path at its 2% least zoom adds small turns (-vscs takes the gaussian path)" },
]

# Every case's class, from a look at its frames: shaky (a handheld, drone or FPV camera), shaky-with-cuts
# (the same, edited with hard cuts), steady (a nearly still camera: only motion stabilization adds
# counts) and unsuitable (no camera shake to remove: games, screen captures, tripods, edited TV, which
# users don't stabilize; reported, never failing a row). Counts are per class.
[classes]
"stab-Animation_360P-08c9" = "unsuitable"  # animated title graphics
"stab-CoverSong_360P-0a9d" = "unsuitable"  # a fixed webcam
"stab-Gaming_1080P-12d4" = "unsuitable"  # a game with a fixed UI over a panning world
"stab-HowTo_1080P-1f3b" = "unsuitable"  # a screen capture with cuts
"stab-Lecture_360P-2276" = "unsuitable"  # a tripod
"stab-LiveMusic_1080P-6d1a" = "unsuitable"  # a fixed concert camera with a burned-in logo
"stab-LiveMusic_360P-1d94" = "unsuitable"  # an edited multi-camera concert
"stab-LiveMusic_360P-265c" = "shaky"  # a phone at a dark concert, flashing lights
"stab-LiveMusic_360P-3be0" = "shaky"  # a phone at a club
"stab-MusicVideo_1080P-0706" = "shaky-with-cuts"
