extends: substitution
message: "Use '%s' instead of '%s'."
link: https://developers.google.com/style/word-list#eg
level: suggestion
ignorecase: true
nonword: true
swap:
  '\b(?:e\.g\.)(?=[\s,;)]|$)': for example
  '\b(?:i\.e\.)(?=[\s,;)]|$)': that is
  '\betc\.': (list the items, or 'and others')
  '\bvia\b': through
