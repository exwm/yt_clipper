StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = ytc

# `just lint-subjects` pipes commit subjects in as .subject, and `just lint-strings` writes
# string literals from code as .strings.
[formats]
subject = md
strings = md

[*.{md,subject}]
BasedOnStyles = Vale, ytc-style
Vale.Spelling = warning
Vale.Terms = warning
ytc-style.HighlightLink = NO

# Release notes describe what changed, so "no longer" and "now also" fit there.
[release-notes/*.md]
ytc-style.ChangelogWording = NO

# A version's notes end each highlight with its readme link (updating.md has no highlights).
[release-notes/[0-9]*.md]
ytc-style.HighlightLink = YES

# Agent instructions (local, untracked) keep the no-em-dash and straight-quote rules only.
[.claude/**/*.md]
BasedOnStyles =
ytc-style.EmDash = YES
ytc-style.CurlyQuotes = YES

# Long, specific subjects are normal, and "note that" is a verb there.
[*.subject]
ytc-style.SentenceLength = NO
ytc-style.NoteThat = NO
# Subjects are fragments by convention, and a trailing "which" names its noun right before it.
ytc-style.Fragment = NO
ytc-style.TrailingWhich = NO

# UI and --help strings are plain text: backticks print literally, and identifiers fail spelling.
[*.strings]
BasedOnStyles = ytc-style
Vale.Repetition = YES
ytc-style.Backticks = NO
ytc-style.BoldLeadIn = NO
ytc-style.ScriptNames = NO
ytc-style.HighlightLink = NO
ytc-style.Fragment = NO
# Terse log diagnostics ("no marker; aborting this pass") are a fair use.
ytc-style.Semicolons = suggestion
# The author's tooltips list one fact per line, often six of them.
ytc-style.ParagraphSentences = NO

# Code comments get only the model-writing rules. Docs conventions (crop point
# naming, backticks, tense, sentence length) don't apply to comments, and
# implementation words ("invariant", "heuristic") are right there.
[*.{py,ts}]
BasedOnStyles = ytc-style
ytc-style.ActorVerbs = NO
ytc-style.Anthropomorphism = NO
ytc-style.Backticks = NO
ytc-style.BoldLeadIn = NO
ytc-style.ChangelogWording = NO
ytc-style.ContrastReframe = NO
ytc-style.Fragment = NO
ytc-style.HighlightLink = NO
ytc-style.Hedges = NO
ytc-style.Intensifiers = NO
ytc-style.InternalTerms = NO
ytc-style.Jargon = NO
ytc-style.Keyframe = NO
ytc-style.Latin = NO
ytc-style.LeadingIng = NO
ytc-style.Minimizers = NO
ytc-style.NoteThat = NO
ytc-style.ParagraphSentences = NO
ytc-style.Puffery = NO
ytc-style.ScriptNames = NO
ytc-style.Semicolons = NO
ytc-style.SentenceLength = NO
ytc-style.ThereIs = NO
ytc-style.TrailingWhich = NO
ytc-style.We = NO
ytc-style.Will = NO
