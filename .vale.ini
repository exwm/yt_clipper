StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = ytc

# `just lint-subjects` pipes commit subjects in as .subject, and `just lint-strings` writes
# string literals from code as .strings.
[formats]
subject = md
strings = md

[*.{md,subject}]
BasedOnStyles = Vale, ytc-style
Vale.Spelling = warning
Vale.Terms = warning

# Release notes describe what changed, so "no longer" and "now also" fit there.
[release-notes/*.md]
ytc-style.ChangelogWording = NO

# Long, specific subjects are normal, and "note that" is a verb there.
[*.subject]
ytc-style.SentenceLength = NO
ytc-style.NoteThat = NO

# UI and --help strings are plain text: backticks print literally, and identifiers fail spelling.
[*.strings]
BasedOnStyles = ytc-style
Vale.Repetition = YES
ytc-style.Backticks = NO
ytc-style.BoldLeadIn = NO
ytc-style.ScriptNames = NO
# Terse log diagnostics ("no marker; aborting this pass") are a fair use.
ytc-style.Semicolons = suggestion

# Code comments get only the model-writing rules. Docs conventions (crop point
# naming, backticks, tense, sentence length) don't apply to comments.
[*.{py,ts}]
BasedOnStyles = ytc-style
ytc-style.Anthropomorphism = NO
ytc-style.Backticks = NO
ytc-style.BoldLeadIn = NO
ytc-style.ChangelogWording = NO
ytc-style.ContrastReframe = NO
ytc-style.Hedges = NO
ytc-style.Intensifiers = NO
ytc-style.Jargon = NO
ytc-style.Keyframe = NO
ytc-style.Latin = NO
ytc-style.LeadingIng = NO
ytc-style.Minimizers = NO
ytc-style.NoteThat = NO
ytc-style.Puffery = NO
ytc-style.ScriptNames = NO
ytc-style.Semicolons = NO
ytc-style.SentenceLength = NO
ytc-style.ThereIs = NO
ytc-style.We = NO
ytc-style.Will = NO
