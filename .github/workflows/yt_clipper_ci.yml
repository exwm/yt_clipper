name: yt_clipper

on:
  push:
    branches:
      - release
      - release/*
      - test-ci

# Read-only unless a job needs more (release writes the draft).
permissions:
  contents: read

# A new push supersedes a run still building the same branch (e.g. a republished release).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NAME: yt_clipper
  VERSION: "5.49.0"
  NODE_VERSION: "22.18.x"

  # Each download is checked against its sha256 here (.github/scripts/verify-sha256.sh). A version
  # bump changes the hashes next to it.
  FFMPEG_VERSION: "9.0.2"
  FFMPEG_WIN_BASE_URL: https://github.com/GyanD/codexffmpeg/releases/download
  # evermeet.cx's macOS builds, mirrored because evermeet rate limits CI runners.
  FFMPEG_MAC_BASE_URL: https://github.com/exwm/yt_clipper_bindeps/releases/download
  FFMPEG_SHA256_WIN: 4d2060a8b34a940aa47d785142055bb92a63053781e55f2ace4546edd519a8f5
  FFMPEG_SHA256_MAC: c120026c5f0c0477cab2d8a54f432c4a57e96ecceb97664bbb6a35553baf6e7c

  YTDLP_VERSION: "2026.10.21"
  YTDLP_BASE_URL: https://github.com/yt-dlp/yt-dlp/releases/download
  YTDLP_SHA256_WIN: 33121d192d706e62f684a06f80918e3f3a8ba52ac3a65213b6951c39c7d9f555
  YTDLP_SHA256_MAC: 7a6fe71d7d680f1fb0ac18d4949873d77db2859e90017c0f44bd94b23be4ee40

  DENO_VERSION: "2.5.6"
  DENO_BASE_URL: https://github.com/denoland/deno/releases/download
  DENO_SHA256_WIN: 1327356cd63e23d0da7d11d5f5ca6b45902b1b62ee2debd4fbbd0aad2aab9786
  DENO_SHA256_MAC: 32a5b2bcf49432715719c7c769529269fbd08cafdc059b7cecd42f9d771059ab

  # Built against the same gyan.dev ffmpeg as FFMPEG_VERSION, whose DLLs it shares.
  VIDEO2X_VERSION: "6.7.0-exwm"
  VIDEO2X_BASE_URL: https://github.com/exwm/video2x/releases/download
  VIDEO2X_SHA256_WIN: b1f1551455bc91176d9f0dc5ae8d01d2b0ff3425a99fe42fb018935d9e63a276
  # The models the clipper uses (RIFE_MODEL in src/clipper/video2x.py), out of about 150 MB.
  VIDEO2X_MODELS: "rife/rife-v4.26"

jobs:
  # The clipper tests from source, beside the build and its smoke test. The release needs both.
  # macOS runners have 3 cores, so its tests split over two jobs (YTC_TEST_SHARD, in conftest.py);
  # the coverage floor holds on the whole Windows run.
  test-clipper:
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    env:
      # Every core: conftest.py caps -n auto at 75% only for a shared dev machine.
      PYTEST_XDIST_AUTO_NUM_WORKERS: ${{ matrix.workers }}
      YTC_TEST_SHARD: ${{ matrix.shard }}
      PYTEST_ADDOPTS: ${{ matrix.shard && '--cov-fail-under=0' || '' }}
    strategy:
      max-parallel: 4
      matrix:
        include:
          - { os: windows-latest, workers: 4, shard: "" }
          - { os: macos-latest, workers: 3, shard: "1/2" }
          - { os: macos-latest, workers: 3, shard: "2/2" }

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/ffmpeg
        with:
          cache-os: ${{ matrix.os }}

      # evermeet's ffmpeg is x86_64: its first run on an arm64 runner waits for Rosetta to translate
      # it, so start that while the environment installs.
      - name: Warm up ffmpeg (macos)
        if: runner.os == 'macOS'
        run: (bindeps/ffmpeg/bin/ffmpeg -version; bindeps/ffmpeg/bin/ffprobe -version) >/dev/null 2>&1 &

      - uses: ./.github/actions/clipper-env

      # ruff's results don't depend on the OS.
      - name: Lint with ruff
        if: runner.os == 'Windows'
        run: just lint-py

      # The downloaded ffmpeg lets the offline end-to-end clip tests run instead of skipping.
      - name: Run clipper tests
        run: PATH="$PWD/bindeps/ffmpeg/bin:$PATH" just test-py

  build:
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 4
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            shortos: win
            yt-dlp_filename: yt-dlp.exe
            exe: yt_clipper.exe
            deno_filename: deno-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            shortos: macos
            yt-dlp_filename: yt-dlp_macos
            exe: yt_clipper
            deno_filename: deno-aarch64-apple-darwin.zip

    steps:
      - name: Set env
        run: |
          echo "FULL_NAME=${{env.NAME}}_${{matrix.shortos}}_${{env.VERSION}}" >> $GITHUB_ENV
          echo "NOPLAT_NAME=${{env.NAME}}_${{env.VERSION}}" >> $GITHUB_ENV
          echo "YTDLP_DL_URL=${{ env.YTDLP_BASE_URL }}/${{ env.YTDLP_VERSION }}/${{ matrix.yt-dlp_filename }}" >> $GITHUB_ENV
          echo "DENO_DL_URL=${{ env.DENO_BASE_URL }}/v${{ env.DENO_VERSION }}/${{ matrix.deno_filename }}" >> $GITHUB_ENV

      - name: Set env (windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "VIDEO2X_DL_URL=${{ env.VIDEO2X_BASE_URL }}/v${{ env.VIDEO2X_VERSION }}/video2x-windows-amd64.zip" >> $GITHUB_ENV
          echo "YTDLP_SHA256=${{ env.YTDLP_SHA256_WIN }}" >> $GITHUB_ENV
          echo "DENO_SHA256=${{ env.DENO_SHA256_WIN }}" >> $GITHUB_ENV

      - name: Set env (macos)
        if: matrix.shortos == 'macos'
        run: |
          echo "YTDLP_SHA256=${{ env.YTDLP_SHA256_MAC }}" >> $GITHUB_ENV
          echo "DENO_SHA256=${{ env.DENO_SHA256_MAC }}" >> $GITHUB_ENV

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up dirs
        run: |
          mkdir -p ./artifact/py/${{env.FULL_NAME}}/{webms,bin/video-tools,bin/yt-dlp,temp}/
          mkdir -p ./bindeps

      - uses: ./.github/actions/ffmpeg
        with:
          cache-os: ${{ matrix.os }}

      - name: Download yt-dlp dependency
        run: |
          cd ./bindeps
          mkdir -p yt-dlp/bin
          cd yt-dlp/bin
          curl --fail --retry 10 --retry-delay 60 --retry-all-errors -O -L $YTDLP_DL_URL
          bash "$GITHUB_WORKSPACE/.github/scripts/verify-sha256.sh" "./${{ matrix.yt-dlp_filename }}" "$YTDLP_SHA256"

          chmod -v +x *

      - name: Download deno dependency
        run: |
          cd ./bindeps
          mkdir -p deno/bin
          cd deno/bin

          curl --fail --retry 10 --retry-delay 60 --retry-all-errors -o ./deno.zip -L $DENO_DL_URL
          bash "$GITHUB_WORKSPACE/.github/scripts/verify-sha256.sh" ./deno.zip "$DENO_SHA256"
          7z x ./deno.zip
          rm -f ./deno.zip

          chmod -v +x *

      - name: Download video2x dependency (windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd ./bindeps
          mkdir -p video2x
          curl --fail --retry 10 --retry-delay 60 --retry-all-errors -o ./video2x.zip -L $VIDEO2X_DL_URL
          bash "$GITHUB_WORKSPACE/.github/scripts/verify-sha256.sh" ./video2x.zip "$VIDEO2X_SHA256_WIN"
          7z x ./video2x.zip -o./video2x
          rm -f ./video2x.zip
          echo "${{ env.VIDEO2X_VERSION }}" > ./video2x/video2x-version.txt

      - uses: ./.github/actions/clipper-env

      - name: Generate executable
        run: just build-py

      # Done with uv
      - name: Minimize uv cache
        run: uv cache prune --ci

      - name: Copy artifacts
        run: |
          cp ./bindeps/ffmpeg/bin/* ./artifact/py/${{env.FULL_NAME}}/bin/video-tools/
          cp ./bindeps/ffmpeg/*.txt ./artifact/py/${{env.FULL_NAME}}/bin/video-tools/
          # yt-dlp on Windows finds deno next to itself.
          mv ./bindeps/yt-dlp/bin/* ./artifact/py/${{env.FULL_NAME}}/bin/yt-dlp/
          mv ./bindeps/deno/bin/* ./artifact/py/${{env.FULL_NAME}}/bin/yt-dlp/

          cp ./src/clipper/include/* ./artifact/py/${{env.FULL_NAME}}/
          cp ./src/clipper/${{matrix.shortos}}_helpers/* ./artifact/py/${{env.FULL_NAME}}/
          mkdir -p ./artifact/py/${{env.FULL_NAME}}/yt-dlp-plugins/ytc
          cp -R ./src/clipper/yt-dlp-plugins/ytc/ ./artifact/py/${{env.FULL_NAME}}/yt-dlp-plugins/
          cp ./dist/py/yt_clipper* ./artifact/py/${{env.FULL_NAME}}/

      - name: Copy video2x (windows)
        if: matrix.os == 'windows-latest'
        run: |
          tools=./artifact/py/${{env.FULL_NAME}}/bin/video-tools

          # video2x loads the ffmpeg DLLs already in video-tools, so they must be the same build.
          for dll in ./bindeps/video2x/av*.dll ./bindeps/video2x/sw*.dll; do
            cmp "$dll" "$tools/$(basename "$dll")" || { echo "::error::video2x and ffmpeg use different ffmpeg builds"; exit 1; }
            rm "$dll"
          done

          # Development files only.
          rm -rf ./bindeps/video2x/{cmake,include,pkgconfig} ./bindeps/video2x/*.lib

          models=./bindeps/video2x/models
          kept=./bindeps/video2x-models
          for model in $VIDEO2X_MODELS; do
            mkdir -p "$kept/$(dirname "$model")"
            mv "$models/$model" "$kept/$model" || { echo "::error::video2x has no model $model"; exit 1; }
          done
          rm -rf "$models" && mv "$kept" "$models"

          for f in ./bindeps/video2x/*; do
            [ ! -e "$tools/$(basename "$f")" ] || { echo "::error::video2x would overwrite $(basename "$f")"; exit 1; }
          done
          cp -r ./bindeps/video2x/* "$tools/"

      # Every option and its help, to read without running the clipper. Redirected output has no
      # styles unless a variable forces a terminal (FORCE_COLOR outranks NO_COLOR), so unset those.
      # The smoke test fails the release if any escape code is left.
      - name: Write the options help
        run: env -u FORCE_COLOR -u TTY_COMPATIBLE -u TTY_INTERACTIVE COLUMNS=100 ./artifact/py/${{env.FULL_NAME}}/yt_clipper --help > ./artifact/py/${{env.FULL_NAME}}/yt_clipper_help.txt

      # Before zipping: the bundled tools run, and the frozen clipper makes clips offline.
      - name: Smoke test the release
        run: just smoke-release ./artifact/py/${{env.FULL_NAME}} ${{env.VERSION}}

      - name: Zip artifacts on windows
        if: matrix.os == 'windows-latest'
        run: |
          # Fastest compression: the contents are mostly already-compressed binaries.
          7z a -mx=1 ./artifact/py/${{env.FULL_NAME}}.zip ./artifact/py/${{env.FULL_NAME}}/

      - name: Zip artifacts on non-windows systems
        if: matrix.os != 'windows-latest'
        run: |
          cd ./artifact/py
          zip -1 -r ${{env.FULL_NAME}}.zip ./${{env.FULL_NAME}}/

      - name: Upload clipper script installation artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.FULL_NAME}}.zip
          path: ./artifact/py/${{env.FULL_NAME}}.zip
          # Already a zip: compressing it again only costs time.
          compression-level: 0

  # The userscript is the same on every OS, so it builds once, on Linux, beside the OS builds.
  markup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Load cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: yarn-ubuntu-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --frozen-lockfile --ignore-scripts

      # test-ts lists the slowest tests with a stdlib Python script.
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.26"

      # With test coverage and its floors.
      - run: just bundle-prod true

      - name: Name the markup script for the release
        run: |
          # Tampermonkey offers updates by this header, so it must carry the release version.
          grep -qF "// @version      ${{env.VERSION}}" ./dist/js/yt_clipper.js || { echo "::error::userscript @version is not ${{env.VERSION}}"; exit 1; }
          mkdir -p ./artifact/js/
          cp ./dist/js/yt_clipper.js ./artifact/js/${{env.NAME}}_${{env.VERSION}}.js

      - name: Upload markup script installation artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.NAME}}_${{env.VERSION}}.js
          path: ./artifact/js/${{env.NAME}}_${{env.VERSION}}.js

  release:
    needs: [test-clipper, build, markup]
    permissions:
      contents: write
    # Only downloads the builds and calls gh, so it runs on Linux and skips a second macOS queue.
    runs-on: ubuntu-latest

    steps:
      - name: Set env
        run: |
          echo "DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "FULL_NAME=${{env.NAME}}_${{env.VERSION}}" >> $GITHUB_ENV
          echo "FULL_NAME_WIN=${{env.NAME}}_win_${{env.VERSION}}" >> $GITHUB_ENV
          echo "FULL_NAME_MAC=${{env.NAME}}_macos_${{env.VERSION}}" >> $GITHUB_ENV

      # Every build artifact at once (downloaded in parallel), each file into the working directory.
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - uses: actions/checkout@v5
        with:
          path: source
          sparse-checkout: |
            changelog.md
            release-notes/updating.md
          sparse-checkout-cone-mode: false

      # This version's changelog section, from its heading to the next version's, with every heading
      # one level up: the version heading becomes the title, then Highlights, Features, Bug Fixes.
      # Every release then ends with how to update (release-notes/updating.md).
      - name: Extract release notes
        run: |
          awk -v heading="## [${{env.VERSION}}]" '
            index($0, heading) == 1 { found = 1 }
            !found { next }
            /^## \[/ && index($0, heading) != 1 { exit }
            /^##+ / { sub(/^#/, "") }
            { print }
          ' source/changelog.md > release-notes.md
          test -s release-notes.md || { echo "No changelog section for ${{env.VERSION}}"; exit 1; }
          printf '\n' >> release-notes.md
          cat source/release-notes/updating.md >> release-notes.md

      # A rerun (e.g. after rewriting the version change) replaces this version's draft. A published
      # release is left alone, and the create below then fails.
      - name: Remove an earlier draft of this release
        run: |
          if [ "$(gh release view v${{env.VERSION}} --repo ${{github.repository}} --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
            gh release delete v${{env.VERSION}} --repo ${{github.repository}} --yes
          fi
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # --target pins the tag to the built commit: a draft's tag is created on publish, and would
      # otherwise land on the default branch. Greasy Fork syncs the userscript from
      # releases/latest/download/yt_clipper.user.js when a release is published (repo webhook; see
      # tools/release/greasyfork.py for its sync URL), which needs a fixed name. The release page
      # shows each asset's label (after #) instead of its file name.
      - name: Create release and upload assets
        run: |
          cp ${{env.FULL_NAME}}.js ${{env.NAME}}.user.js
          gh release create v${{env.VERSION}} \
            --repo ${{github.repository}} \
            --target ${{github.sha}} \
            --title "${{env.NAME}} v${{env.VERSION}} [${{env.DATE}}]" \
            --notes-file release-notes.md \
            --draft \
            "${{env.FULL_NAME_WIN}}.zip#${{env.FULL_NAME_WIN}}.zip (clipper script for Windows)" \
            "${{env.FULL_NAME_MAC}}.zip#${{env.FULL_NAME_MAC}}.zip (clipper script for macOS)" \
            "${{env.FULL_NAME}}.js#${{env.FULL_NAME}}.js (markup script for user script extensions)" \
            "${{env.NAME}}.user.js#${{env.NAME}}.user.js (markup script, same file for Greasy Fork sync)"
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
