name: yt_clipper

on:
  push:
    branches:
      - release
      - release/*
      - test-ci

# Read-only unless a job needs more (release writes the draft).
permissions:
  contents: read

# A new push supersedes a run still building the same branch (e.g. a republished release).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NAME: yt_clipper
  VERSION: "5.47.1"
  NODE_VERSION: "22.18.x"

  FFMPEG_VERSION: "8.0.1"
  FFMPEG_WIN_BASE_URL: https://github.com/GyanD/codexffmpeg/releases/download
  # evermeet.cx's macOS builds, mirrored because evermeet rate limits CI runners.
  FFMPEG_MAC_BASE_URL: https://github.com/exwm/yt_clipper_bindeps/releases/download

  YTDLP_VERSION: "2026.08.19"
  YTDLP_BASE_URL: https://github.com/yt-dlp/yt-dlp/releases/download

  DENO_VERSION: "2.5.6"
  DENO_BASE_URL: https://github.com/denoland/deno/releases/download

  VIDEO2X_VERSION: "6.5.0-exwm"
  VIDEO2X_BASE_URL: https://github.com/exwm/video2x/releases/download

jobs:
  build:
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 4
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            shortos: win
            yt-dlp_filename: yt-dlp.exe
            exe: yt_clipper.exe
            deno_filename: deno-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            shortos: macos
            yt-dlp_filename: yt-dlp_macos
            exe: yt_clipper
            deno_filename: deno-aarch64-apple-darwin.zip

    steps:
      - name: Set env
        run: |
          echo "FULL_NAME=${{env.NAME}}_${{matrix.shortos}}_${{env.VERSION}}" >> $GITHUB_ENV
          echo "NOPLAT_NAME=${{env.NAME}}_${{env.VERSION}}" >> $GITHUB_ENV
          echo "FULL_NAME_WIN_FULL=${{env.NAME}}_win_${{env.VERSION}}_full" >> $GITHUB_ENV
          echo "YTDLP_DL_URL=${{ env.YTDLP_BASE_URL }}/${{ env.YTDLP_VERSION }}/${{ matrix.yt-dlp_filename }}" >> $GITHUB_ENV
          echo "DENO_DL_URL=${{ env.DENO_BASE_URL }}/v${{ env.DENO_VERSION }}/${{ matrix.deno_filename }}" >> $GITHUB_ENV

      - name: Set env (windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "FFMPEG_DL_NAME=ffmpeg-${{ env.FFMPEG_VERSION }}-full_build-shared" >> $GITHUB_ENV
          echo "FFMPEG_DL_PREFIX=${{ env.FFMPEG_WIN_BASE_URL }}/${{ env.FFMPEG_VERSION }}" >> $GITHUB_ENV
          echo "VIDEO2X_DL_URL=${{ env.VIDEO2X_BASE_URL }}/v${{ env.VIDEO2X_VERSION }}/video2x-windows-amd64.zip" >> $GITHUB_ENV

      - name: Set env (macos)
        if: matrix.shortos == 'macos'
        run: |
          echo "FFMPEG_DL_NAME=ffmpeg-${{ env.FFMPEG_VERSION }}-macos64" >> $GITHUB_ENV
          echo "FFMPEG_DL_PREFIX=${{ env.FFMPEG_MAC_BASE_URL }}/${{ env.FFMPEG_VERSION }}" >> $GITHUB_ENV

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up dirs
        run: |
          mkdir -p ./artifact/py/${{env.FULL_NAME}}/{webms,bin,temp}/
          mkdir -p ./bindeps

      # A pinned ffmpeg build never changes, so download it once per OS and version.
      - name: Cache ffmpeg dependency
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: bindeps/ffmpeg
          key: ffmpeg-${{ matrix.os }}-${{ env.FFMPEG_VERSION }}

      - name: Download ffmpeg dependency (windows)
        if: matrix.os == 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          cd ./bindeps
          curl --fail --retry 10 --retry-delay 60 --retry-all-errors -o ./ffmpeg.zip -L $FFMPEG_DL_PREFIX/$FFMPEG_DL_NAME.7z
          7z x ./ffmpeg.zip
          mv ./$FFMPEG_DL_NAME ffmpeg

          ./ffmpeg/bin/ffmpeg -version > version.txt
          mv version.txt ffmpeg

      - name: Download ffmpeg dependency (macos)
        if: matrix.shortos == 'macos' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          cd ./bindeps
          # --fail keeps an error page from being saved as the archive. --retry-all-errors also retries
          # failures curl does not class as transient, such as a 429 reported as exit 56.
          curl --fail --retry 10 --retry-delay 60 --retry-all-errors -o ./ffmpeg.zip -L $FFMPEG_DL_PREFIX/$FFMPEG_DL_NAME.zip
          7z x ./ffmpeg.zip
          mv ./$FFMPEG_DL_NAME ffmpeg
          chmod -v +x ffmpeg/bin/*

      - name: Download yt-dlp dependency
        run: |
          cd ./bindeps
          mkdir -p yt-dlp/bin
          cd yt-dlp/bin
          curl --fail --retry 10 --retry-delay 60 --retry-all-errors -O -L $YTDLP_DL_URL

          chmod -v +x *

      - name: Download deno dependency
        run: |
          cd ./bindeps
          mkdir -p deno/bin
          cd deno/bin

          curl --fail --retry 10 --retry-delay 60 --retry-all-errors -o ./deno.zip -L $DENO_DL_URL
          7z x ./deno.zip
          rm -f ./deno.zip

          chmod -v +x *

      - name: Download video2x dependency (windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd ./bindeps
          mkdir -p video2x
          curl --fail --retry 10 --retry-delay 60 --retry-all-errors -o ./video2x.zip -L $VIDEO2X_DL_URL
          7z x ./video2x.zip -o./video2x
          rm -f ./video2x.zip
          echo "${{ env.VIDEO2X_VERSION }}" > ./video2x/version.txt

      - name: Disable Windows Defender realtime scanning
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked

      - name: Lint with ruff
        run: just lint-py

      - name: Run clipper tests
        run: just test-py

      - name: Generate executable
        run: just build-py

      # Done with uv
      - name: Minimize uv cache
        run: uv cache prune --ci

      - name: Copy artifacts
        run: |
          # Copy, not move: the ffmpeg cache saves bindeps/ffmpeg after the job.
          cp ./bindeps/ffmpeg/bin/* ./artifact/py/${{env.FULL_NAME}}/bin/
          cp ./bindeps/ffmpeg/*.txt ./artifact/py/${{env.FULL_NAME}}/bin/
          mv ./bindeps/yt-dlp/bin/* ./artifact/py/${{env.FULL_NAME}}/bin/
          mv ./bindeps/deno/bin/* ./artifact/py/${{env.FULL_NAME}}/bin/

          cp ./src/clipper/include/* ./artifact/py/${{env.FULL_NAME}}/
          cp ./src/clipper/${{matrix.shortos}}_helpers/* ./artifact/py/${{env.FULL_NAME}}/
          mkdir -p ./artifact/py/${{env.FULL_NAME}}/yt-dlp-plugins/ytc
          cp -R ./src/clipper/yt-dlp-plugins/ytc/ ./artifact/py/${{env.FULL_NAME}}/yt-dlp-plugins/
          cp ./dist/py/yt_clipper* ./artifact/py/${{env.FULL_NAME}}/

      - name: Copy full artifacts (windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p ./artifact/py/${{env.FULL_NAME_WIN_FULL}}/
          cp -r ./artifact/py/${{env.FULL_NAME}}/* ./artifact/py/${{env.FULL_NAME_WIN_FULL}}/
          mkdir -p ./artifact/py/${{env.FULL_NAME_WIN_FULL}}/bin/video2x
          cp -r ./bindeps/video2x/* ./artifact/py/${{env.FULL_NAME_WIN_FULL}}/bin/video2x/

      - name: Print clipper install version
        run: ./dist/py/${{ matrix.exe }} --version

      - name: Zip artifacts on windows
        if: matrix.os == 'windows-latest'
        run: |
          # Fastest compression: the contents are mostly already-compressed binaries.
          7z a -mx=1 ./artifact/py/${{env.FULL_NAME}}.zip ./artifact/py/${{env.FULL_NAME}}/
          7z a -mx=1 ./artifact/py/${{env.FULL_NAME_WIN_FULL}}.zip ./artifact/py/${{env.FULL_NAME_WIN_FULL}}/

      - name: Zip artifacts on non-windows systems
        if: matrix.os != 'windows-latest'
        run: |
          cd ./artifact/py
          zip -1 -r ${{env.FULL_NAME}}.zip ./${{env.FULL_NAME}}/

      - name: Upload clipper script installation artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.FULL_NAME}}.zip
          path: ./artifact/py/${{env.FULL_NAME}}.zip
          # Already a zip: compressing it again only costs time.
          compression-level: 0

      - name: Upload full clipper script installation artifact (windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.FULL_NAME_WIN_FULL}}.zip
          path: ./artifact/py/${{env.FULL_NAME_WIN_FULL}}.zip
          compression-level: 0

  # The userscript is the same on every OS, so it builds once, on Linux, beside the OS builds.
  markup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Load cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: yarn-ubuntu-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --frozen-lockfile --ignore-scripts

      - run: just bundle-prod

      - name: Name the markup script for the release
        run: |
          mkdir -p ./artifact/js/
          cp ./dist/js/yt_clipper.js ./artifact/js/${{env.NAME}}_${{env.VERSION}}.js

      - name: Upload markup script installation artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.NAME}}_${{env.VERSION}}.js
          path: ./artifact/js/${{env.NAME}}_${{env.VERSION}}.js

  release:
    needs: [build, markup]
    permissions:
      contents: write
    # Only downloads the builds and calls gh, so it runs on Linux and skips a second macOS queue.
    runs-on: ubuntu-latest

    steps:
      - name: Set env
        run: |
          echo "DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "FULL_NAME=${{env.NAME}}_${{env.VERSION}}" >> $GITHUB_ENV
          echo "FULL_NAME_WIN=${{env.NAME}}_win_${{env.VERSION}}" >> $GITHUB_ENV
          echo "FULL_NAME_MAC=${{env.NAME}}_macos_${{env.VERSION}}" >> $GITHUB_ENV
          echo "FULL_NAME_WIN_FULL=${{env.NAME}}_win_${{env.VERSION}}_full" >> $GITHUB_ENV

      # Every build artifact at once (downloaded in parallel), each file into the working directory.
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - uses: actions/checkout@v5
        with:
          path: source
          sparse-checkout: changelog.md
          sparse-checkout-cone-mode: false

      # This version's changelog section, from its heading to the next version's, with every heading
      # one level up: the version heading becomes the title, then Highlights, Features, Bug Fixes.
      - name: Extract release notes
        run: |
          awk -v heading="## [${{env.VERSION}}]" '
            index($0, heading) == 1 { found = 1 }
            !found { next }
            /^## \[/ && index($0, heading) != 1 { exit }
            /^##+ / { sub(/^#/, "") }
            { print }
          ' source/changelog.md > release-notes.md
          test -s release-notes.md || { echo "No changelog section for ${{env.VERSION}}"; exit 1; }

      # A rerun (e.g. after rewriting the version change) replaces this version's draft. A published
      # release is left alone, and the create below then fails.
      - name: Remove an earlier draft of this release
        run: |
          if [ "$(gh release view v${{env.VERSION}} --repo ${{github.repository}} --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
            gh release delete v${{env.VERSION}} --repo ${{github.repository}} --yes
          fi
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # --target pins the tag to the built commit: a draft's tag is created on publish, and would
      # otherwise land on the default branch.
      - name: Create release and upload assets
        run: |
          gh release create v${{env.VERSION}} \
            --repo ${{github.repository}} \
            --target ${{github.sha}} \
            --title "${{env.NAME}} v${{env.VERSION}} [${{env.DATE}}]" \
            --notes-file release-notes.md \
            --draft \
            ${{env.FULL_NAME_WIN}}.zip \
            ${{env.FULL_NAME_WIN_FULL}}.zip \
            ${{env.FULL_NAME_MAC}}.zip \
            ${{env.FULL_NAME}}.js
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
